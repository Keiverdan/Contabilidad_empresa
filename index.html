<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>La Contabilidad de Elohim — Sistema VEN-NIF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased overflow-hidden">

  <!-- HEADER: altura fija, sin wrap que rompa el layout -->
  <header id="appHeader" class="no-print bg-slate-900 text-white shadow-md border-b border-slate-800 flex-shrink-0 z-40 relative">
    <div class="px-3 sm:px-4 py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <button id="btnMenu" class="md:hidden text-amber-400 text-xl flex-shrink-0" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <i class="fa-solid fa-book-bookmark text-amber-400 text-xl flex-shrink-0"></i>
        <span class="font-bold text-sm sm:text-lg tracking-wide text-amber-400 truncate">La Contabilidad de Elohim</span>
        <span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded border border-slate-700 hidden md:inline-block">VEN-NIF / SENIAT</span>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <div class="hidden lg:flex items-center gap-1">
          <label class="text-slate-400 text-[10px]"><i class="fa-solid fa-building mr-1"></i>Empresa:</label>
          <select id="empresaSelect" class="bg-slate-800 border border-slate-700 text-white text-[10px] rounded px-2 py-1">
            <option value="1">Inversiones Elohim, C.A.</option>
          </select>
        </div>
        <div class="hidden sm:flex items-center gap-1 bg-slate-800 px-2 py-1 rounded border border-slate-700 text-[11px]">
          <i class="fa-solid fa-coins text-amber-400"></i>
          <span class="font-semibold">BCV: <span id="tcLabel" class="text-emerald-400 font-mono">900.00</span></span>
        </div>
        <button id="btnTutorial" class="bg-purple-600 hover:bg-purple-700 text-white px-2 py-1.5 rounded text-[11px] font-semibold" title="Tutorial">
          <i class="fa-solid fa-graduation-cap"></i>
        </button>
        <button id="btnExportJSON" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1.5 rounded text-[11px] font-semibold" title="Respaldo JSON">
          <i class="fa-solid fa-database"></i>
        </button>
        <label class="bg-slate-700 hover:bg-slate-600 text-white px-2 py-1.5 rounded cursor-pointer text-[11px] font-semibold" title="Cargar JSON">
          <i class="fa-solid fa-upload"></i>
          <input type="file" id="fileImportJSON" accept=".json" class="hidden">
        </label>
        <button id="btnExportHTML" class="hidden sm:inline-flex bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-2 py-1.5 rounded text-[11px]" title="Descargar sistema">
          <i class="fa-solid fa-download"></i>
        </button>
        <button id="btnReset" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1.5 rounded text-[11px] font-semibold" title="Resetear datos">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="flex-1 flex min-h-0 relative overflow-hidden">

    <!-- BACKDROP móvil -->
    <div id="sidebarBackdrop" class="hidden fixed inset-0 bg-black/60 z-30 md:hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar"
      class="no-print bg-slate-800 text-slate-300 flex flex-col border-r border-slate-700 flex-shrink-0
             fixed md:static inset-y-0 left-0 z-40 w-64
             transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out
             md:h-full h-full">
      <!-- header móvil del sidebar (con botón cerrar) -->
      <div class="md:hidden flex items-center justify-between p-3 border-b border-slate-700 flex-shrink-0">
        <span class="font-bold text-amber-400 text-sm">Menú</span>
        <button onclick="cerrarSidebar()" class="text-slate-300 text-xl" aria-label="Cerrar menú">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <!-- nav: min-h-0 CRÍTICO para que el overflow funcione -->
      <nav class="flex-1 min-h-0 overflow-y-auto overscroll-contain p-3 space-y-5 scroll-suave" id="navMenu"></nav>
      <div class="p-3 border-t border-slate-700 text-[10px] text-center text-slate-400 flex-shrink-0">
        Venezuela · .Bs · SENIAT · v2.4
      </div>
    </aside>

    <!-- MAIN -->
    <main id="mainContent" class="flex-1 min-w-0 overflow-y-auto scroll-suave bg-slate-50 p-3 sm:p-6">
      <div id="alertContainer" class="sticky top-0 z-20"></div>
      <div id="viewContainer"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plan-cuentas.js"></script>
  <script src="js/tasas.js"></script>
  <script src="js/terceros.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/presupuestos.js"></script>
  <script src="js/asientos.js"></script>
  <script src="js/compras.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/servicios.js"></script>
  <script src="js/nomina.js"></script>
  <script src="js/nominaRapida.js"></script>
  <script src="js/libros.js"></script>
  <script src="js/cierres.js"></script>
  <script src="js/seniat.js"></script>
  <script src="js/estructuraCompras.js"></script>
  <script src="js/ganancias.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/glosario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
